name: Publish Extension

on:
  push:
    tags:
      - 'v*.*.*'  # v1.0.0, v1.2.3 などのタグでトリガー
  workflow_dispatch:  # 手動実行も可能

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:error

      - name: Build extension
        run: npm run compile

      - name: Unit & webview tests
        run: npm run test:unit

  publish:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install vsce and ovsx
        run: npm install -g @vscode/vsce ovsx

      - name: Package extension
        run: vsce package

      - name: Publish to VS Code Marketplace
        id: vsce
        run: vsce publish -p ${{ secrets.VSCE_PAT }}
        continue-on-error: true  # Marketplace側が失敗してもOpen VSXへの公開を続行

      - name: Publish to Open VSX
        run: ovsx publish *.vsix -p ${{ secrets.OVSX_PAT }}

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix-package
          path: '*.vsix'
          retention-days: 30

      # Marketplace 側の失敗を握りつぶさない（PAT 期限切れでも job が緑になるのを防ぐ）。
      # Open VSX への公開と VSIX の保存を終えたあとで、job を失敗として終わらせる。
      - name: Fail if Marketplace publish failed
        if: steps.vsce.outcome == 'failure'
        run: |
          echo "::error::VS Code Marketplace への公開に失敗しました（VSCE_PAT の期限切れが典型）。Open VSX には公開済みです。"
          exit 1

  create-release:
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: vsix-package
          path: ./artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: ./artifacts/*.vsix
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
